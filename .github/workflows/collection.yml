name: VWP Studio release
on:
  push:
    branches: ['codex/personalization-studio', 'codex/smooth-transitions']
    tags: ['v0.5.*', 'v0.6.*', 'v0.7.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vwp-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unchanged cinematic masters from verified official release
        run: python tools/fetch_cinematic.py
      - name: Verify catalog and personalization assets
        run: |
          python -m pip install 'Pillow>=11,<13' imageio-ffmpeg==0.6.0
          python tools/check_expansion.py
          python tools/check_cinematic.py
          python tools/check_personalization.py
          python tools/bootstrap_ffmpeg.py
      - name: Prepare WebView2 on the cloud runner
        if: hashFiles('assets/living/catalog.json') != ''
        shell: pwsh
        run: |
          $runtimeKeys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $runtimeVersions = @($runtimeKeys | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($runtimeVersions.Count -eq 0) {
            $bootstrap = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrap
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') { throw 'Unverified WebView2 bootstrapper' }
            $setup = Start-Process -FilePath $bootstrap -ArgumentList '/silent','/install' -WindowStyle Hidden -PassThru -Wait
            if ($setup.ExitCode -ne 0) { throw "WebView2 setup failed: $($setup.ExitCode)" }
          }
      - name: Render originals and verify native city
        if: hashFiles('assets/living/catalog.json') != ''
        shell: pwsh
        run: |
          dotnet build tools/live-check/live-check.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Native renderer build failed' }
          $checker = (Resolve-Path tools/live-check/bin/Release/net8.0-windows/live-check.exe).Path
          $city = Start-Process -FilePath $checker -ArgumentList '--city-check' -WindowStyle Hidden -PassThru -Wait
          Get-Content artifacts/city-check/status.txt
          if ($city.ExitCode -ne 0) { throw 'Native city verification failed' }
          foreach ($scene in 1001,1002,1003) {
            $render = Start-Process -FilePath $checker -ArgumentList '--living-render',$scene,'2160','60' -WindowStyle Hidden -PassThru -Wait
            Get-Content "artifacts/living-check/$scene-status.txt"
            if ($render.ExitCode -ne 0) { throw "Original scene $scene failed" }
          }
          python tools/check_living.py
          if ($LASTEXITCODE -ne 0) { throw 'Original master verification failed' }
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('assets/living/catalog.json') != ''
        with:
          name: VWP-Originals-QA
          path: |
            artifacts/city-check/*.png
            artifacts/city-check/*.json
            artifacts/city-check/status.txt
            artifacts/living-check/*-metrics.json
            artifacts/living-check/*-status.txt
            artifacts/living-check/*-motion.png
          retention-days: 14
      - name: Build complete Windows distribution
        shell: pwsh
        run: |
          [xml]$project = Get-Content VWP.csproj
          $version = $project.Project.PropertyGroup.Version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag/version mismatch' }
          ./build.ps1 -Installer
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          python tools/package_release.py --version $version --build "dist/Release-$version"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Verify native cursors, Windows restore, imports and launcher
        shell: pwsh
        run: |
          [xml]$project = Get-Content VWP.csproj
          $version = $project.Project.PropertyGroup.Version
          dotnet "dist/Release-$version/VWP.dll" --verify-personalization
          if ($LASTEXITCODE -ne 0) { throw 'Verification process failed' }
          $report = Get-Content "dist/Release-$version/verification/personalization-result.json" -Raw | ConvertFrom-Json
          if (@($report | Where-Object { !$_.passed }).Count -gt 0) { $report | ConvertTo-Json -Depth 5; throw 'Personalization checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VWP-Windows
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: VWP-Studio-QA
          path: dist/Release-*/verification/studio-*.png
          retention-days: 14
      - name: Publish official release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          [xml]$project = Get-Content VWP.csproj
          $version = $project.Project.PropertyGroup.Version
          $notes = "docs/RELEASE-$version.md"
          gh release view $tag --repo '${{ github.repository }}' --json tagName --jq '.tagName' *> $null
          if ($LASTEXITCODE -ne 0) {
            $title = (Get-Content $notes -Encoding utf8 -TotalCount 1) -replace '^#\s+', ''
            gh release create $tag --repo '${{ github.repository }}' --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $existing = @(gh release view $tag --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Release inspection failed' }
          $files = @(Get-ChildItem -Path 'dist/*-Setup.exe', 'dist/*.zip', 'dist/*.sha256' | Where-Object { $_.Name -notin $existing } | ForEach-Object { $_.FullName })
          if ($files.Count -gt 0) {
            gh release upload $tag @files --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }
