name: Windows release
on:
  push:
    tags: ['v*', '!vwp-pack-*', '!v0.5.*', '!v0.6.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify assets
        run: |
          python -m pip install -r tools/requirements-media.txt
          python tools/bootstrap_ffmpeg.py
          python tools/verify_presets.py
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          [xml]$project = Get-Content VWP.csproj
          $version = $project.Project.PropertyGroup.Version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag/version mismatch' }
          ./build.ps1 -Installer
          python tools/package_release.py --version $version --build "dist/Release-$version"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VWP-Windows
          path: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*.sha256
      - name: Publish release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --generate-notes }
          $existing = @(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Release inspection failed' }
          $uploadFiles = @(Get-ChildItem -Path 'dist/*-Setup.exe', 'dist/*.zip', 'dist/*.sha256' | Where-Object { $_.Name -notin $existing } | ForEach-Object { $_.FullName })
          if ($uploadFiles.Count -gt 0) {
            gh release upload '${{ github.ref_name }}' @uploadFiles --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }
