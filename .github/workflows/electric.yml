name: Sixty live wallpapers
on:
  workflow_dispatch:
  pull_request:
    paths: ['assets/electric/**', 'assets/horizons/**', 'assets/winter/**', 'assets/village-winter/**', 'assets/village-summer/**', 'assets/muses/**', 'tools/*collections*', 'DesktopHost*.cs', 'MainWindow.Living.cs', 'MainWindow.Features.cs', 'MainWindow.xaml', '.github/workflows/electric.yml']
permissions:
  contents: read
jobs:
  render-and-check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install 'Pillow>=11,<13' imageio-ffmpeg==0.6.0 'numpy>=2,<3'
      - run: python tools/configure_collections.py
      - run: python tools/render_collections.py
      - run: python tools/check_collections.py
      - run: dotnet build tools/live-check/live-check.csproj -c Release --nologo
      - name: Verify live clock and playback
        shell: pwsh
        run: |
          $check = Start-Process tools/live-check/bin/Release/net8.0-windows/live-check.exe -ArgumentList '--electric-check' -WindowStyle Hidden -PassThru -Wait
          Get-Content artifacts/electric-check/status.txt
          if ($check.ExitCode -ne 0) { throw 'Electric verification failed' }
      - name: Verify import through VWP bundle service
        shell: pwsh
        run: |
          $check = Start-Process tools/live-check/bin/Release/net8.0-windows/live-check.exe -ArgumentList '--collection-bundle-check' -WindowStyle Hidden -PassThru -Wait
          Get-Content artifacts/collection-bundle-check.txt
          if ($check.ExitCode -ne 0) { throw 'Bundle import failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VWP-Sixty-Live-Wallpapers
          path: |
            ../VWP-60-Live-Wallpapers/
            artifacts/electric-check/
            artifacts/collection-bundle-check.txt
